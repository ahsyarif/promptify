services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promptify
      POSTGRES_PASSWORD: promptify
      POSTGRES_DB: promptify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptify"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://promptify:promptify@db:5432/promptify?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
