{{define "content"}}
<section class="intro">
  <h1>{{.Title}}</h1>
  <p class="muted">{{if eq .Nav "bookmarks"}}Prompts you've saved on this device.{{else}}Discover image prompts for Midjourney, Stable Diffusion, DALL·E and Flux.{{end}}</p>
</section>

<form class="filters" action="{{.BasePath}}" method="get"
      hx-get="{{.BasePath}}" hx-target="#results" hx-push-url="true"
      hx-trigger="input delay:250ms, submit" hx-sync="this:replace" hx-indicator="#results">
  <div class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" value="{{.Query}}" placeholder="Search image prompts…" aria-label="Search image prompts" autocomplete="off" data-search>
    <kbd>/</kbd>
  </div>
  <fieldset class="chips">
    <legend class="sr-only">Category</legend>
    <label class="chip"><input type="radio" name="category" value="" {{if not .Category}}checked{{end}}><span>All</span></label>
    {{range .Categories}}
    <label class="chip">
      <input type="radio" name="category" value="{{.Slug}}" {{if eq .Slug $.Category}}checked{{end}}>
      <span>{{.Name}}{{if ne $.Nav "bookmarks"}} <small>{{.PromptCount}}</small>{{end}}</span>
    </label>
    {{end}}
  </fieldset>
  <noscript><button class="btn" type="submit">Apply</button></noscript>
</form>

<div id="results" class="results">{{template "results" .}}</div>
{{end}}
